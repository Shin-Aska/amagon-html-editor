name: Build and Release Electron App

# Version tags or manual branch builds prepare drafts for owner review.
on:
  push:
    tags:
      - 'v*'
  # Allows you to trigger the build manually from the GitHub Actions tab
  workflow_dispatch:

# Grant the GITHUB_TOKEN permission to create releases and upload assets
permissions:
  contents: write

jobs:
  release:
    # Use a matrix to run the job on different OS virtual machines
    strategy:
      matrix:
        # Keep the same Windows/Linux download set as previous releases.
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Test Regression Suite
        run: npm test -- --maxWorkers=1

      - name: Test Electron Process Ownership
        run: npm run test:e2e:ownership

      - name: Build Code
        run: npm run build

      - name: Check TypeScript
        run: npx tsc --noEmit -p tsconfig.json

      - name: Verify Desktop Workflows
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run --auto-servernum npm run test:e2e:release
          else
            npm run test:e2e:electron
          fi

      - name: Upload Desktop Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: .omo/evidence/amg-bundled-project-format/task-13-amg-bundled-project-format/test-results
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Build and Publish with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            npm run dist:linux -- --publish always
          elif [ "$RUNNER_OS" == "Windows" ]; then
            npm run dist:win -- --publish always
          elif [ "$RUNNER_OS" == "macOS" ]; then
            npm run dist:mac -- --publish always
          fi
