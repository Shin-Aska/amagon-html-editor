name: Build and Release Electron App

# Version tags or manual branch builds prepare drafts for owner review.
on:
  push:
    tags:
      - 'v*'
  # Allows you to trigger the build manually from the GitHub Actions tab
  workflow_dispatch:

# Grant the GITHUB_TOKEN permission to create releases and upload assets
permissions:
  contents: write

jobs:
  release:
    # Use a matrix to run the job on different OS virtual machines
    strategy:
      matrix:
        # Keep the same Windows/Linux download set as previous releases.
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Code
        run: npm run build

      - name: Check TypeScript
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build and Publish with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            npm run dist:linux -- --publish always
          elif [ "$RUNNER_OS" == "Windows" ]; then
            npm run dist:win -- --publish always
          elif [ "$RUNNER_OS" == "macOS" ]; then
            npm run dist:mac -- --publish always
          fi
