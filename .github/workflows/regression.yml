name: Regression Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - README.md
      - GUIDELINES.md
      - .aiassistant/rules/project-context.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Test Regression Suite
        run: npm test -- --maxWorkers=1
      - name: Test Electron Process Ownership
        run: npm run test:e2e:ownership
      - name: Check TypeScript
        run: npx tsc --noEmit -p tsconfig.json
